apiVersion: apps/v1
kind: Deployment
metadata: 
  name: web-app
  labels:
    app: web-app
spec:
  replicas: 3
  selector: 
    matchLabels:
      app: web-app
  strategy:
    type: RollingUpdate
    rollingUpdate: 
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers: 
      - name: nginx
        image: nginx:1.25
        ports: 
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi