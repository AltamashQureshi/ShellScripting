apiVersion: v1
kind: Pod
metadata:
  name: busybox-pod
  labels:
    app: busybox-pod
    env: learning
spec:
  containers:
  - name: busybox-pod
    image: busybox:1.35
    command: ['sh', '-c', 'sleep 3600']
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: "128Mi"
        cpu: "500m"

