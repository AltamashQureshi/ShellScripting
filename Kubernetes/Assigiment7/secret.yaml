apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
data:
  DB_PASSWORD: U3VwZXJTZWNyZXQxMjM=
  DB_USER: YWRtaW4=
---
apiVersion: v1
kind: Pod

metadata:
  name: app
spec:
  containers:
  - name: app
    image: busybox
    command: ['sh', '-c', 'echo $DB_USER && sleep 3600']
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: DB_USER
    - name: DB_PASSWORD
      valueFrom: 
        secretKeyRef:
          name: db-credentials
          key: DB_PASSWORD