apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox
      command: ['sh', '-c', 'env && cat /config/database.conf && sleep 3600']
      env:
      - name: APP_ENV
        valueFrom:
          configMapKeyRef:
            name: app-config
            key: APP_ENV
      - name: APP_PORT
        valueFrom:
          configMapKeyRef:
            name: app-config
            key: APP_PORT
      envFrom:
      - configMapRef:
          name: app-config
      volumeMounts:
      - name: config-volume
        mountPath: /config
  volumes:
  - name: config-volume
    configMap: 
      name: app-config
      items:
      - key: database.conf
        path: database.conf

